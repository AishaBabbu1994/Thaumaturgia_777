<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creador de Sigilos - Método del Círculo</title>
<style>
  body {
    background-color: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    margin: 0;
  }
  .container {
    background: #16213e;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    text-align: center;
    max-width: 600px;
    width: 100%;
  }
  h1 { color: #f4d03f; font-weight: normal; margin-bottom: 10px; }
  .subtitle { font-size: 14px; color: #a0a0b0; margin-bottom: 20px; }
  input[type="text"] {
    width: 85%;
    padding: 12px;
    margin: 10px 0;
    border: 2px solid #0f3460;
    border-radius: 8px;
    background: #0a192f;
    color: #fff;
    font-size: 16px;
    text-align: center;
    outline: none;
  }
  input:focus { border-color: #f4d03f; }
  button {
    background: #f4d03f;
    color: #1a1a2e;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin: 10px 5px;
    transition: background 0.3s;
  }
  button:hover { background: #d4ac0d; }
  canvas {
    background: #fff;
    border-radius: 10px;
    margin-top: 20px;
    border: 3px solid #f4d03f;
    max-width: 100%;
  }
  .step-box {
    background: #0f3460;
    padding: 12px;
    border-radius: 8px;
    margin: 10px 0;
    font-size: 15px;
  }
  .step-label { color: #f4d03f; font-weight: bold; font-size: 13px; }
  .step-text { color: #fff; font-size: 18px; letter-spacing: 3px; margin-top: 5px; word-break: break-all; }
  .crossed { text-decoration: line-through; color: #888; }
</style>
</head>
<body>
  <div class="container">
    <h1> Creador de Sigilos 🔮</h1>
    <p class="subtitle">Método del círculo alfabético (como en el video)</p>
    
    <input type="text" id="intention" placeholder="Escribe tu intención (ej: SOY ABUNDANCIA ETERNA)" oninput="updateSigil()">
    
    <div class="step-box">
      <div class="step-label">Paso 1 - Intención original:</div>
      <div class="step-text" id="originalText">-</div>
    </div>
    
    <div class="step-box">
      <div class="step-label">Paso 2 - Consonantes únicas (sin vocales ni duplicados):</div>
      <div class="step-text" id="consonantsText">-</div>
    </div>
    
    <canvas id="sigilCanvas" width="500" height="500"></canvas>
    <br>
    <button onclick="downloadSigil()">💾 Guardar como imagen</button>
  </div>

<script>
  const canvas = document.getElementById('sigilCanvas');
  const ctx = canvas.getContext('2d');
  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const vowels = "AEIOU";

  function extractConsonants(text) {
    const clean = text.toUpperCase().replace(/[^A-Z]/g, '');
    const noVowels = clean.replace(/[AEIOU]/g, '');
    let unique = '';
    for (let char of noVowels) {
      if (!unique.includes(char)) unique += char;
    }
    return unique;
  }

  function getLetterPosition(letter, centerX, centerY, radius) {
    const index = alphabet.indexOf(letter);
    const angle = (index / 26) * Math.PI * 2 - Math.PI / 2;
    return {
      x: centerX + radius * Math.cos(angle),
      y: centerY + radius * Math.sin(angle)
    };
  }

  function drawSigil(consonants) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const circleRadius = 180;
    const letterRadius = 210;

    // Dibujar círculo principal
    ctx.beginPath();
    ctx.arc(centerX, centerY, circleRadius, 0, Math.PI * 2);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Dibujar letras del alfabeto alrededor
    ctx.font = 'bold 16px Segoe UI';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    for (let i = 0; i < 26; i++) {
      const letter = alphabet[i];
      const pos = getLetterPosition(letter, centerX, centerY, letterRadius);
      const isConsonant = consonants.includes(letter);
      ctx.fillStyle = isConsonant ? '#e74c3c' : '#666';
      ctx.fillText(letter, pos.x, pos.y);
    }

    if (consonants.length === 0) {
      ctx.fillStyle = '#999';
      ctx.font = '18px Segoe UI';
      ctx.fillText('Escribe una intención para comenzar', centerX, centerY);
      return;
    }

    // Dibujar líneas conectando las consonantes en orden
    ctx.beginPath();
    const points = [];
    
    for (let i = 0; i < consonants.length; i++) {
      const letter = consonants[i];
      const pos = getLetterPosition(letter, centerX, centerY, circleRadius - 20);
      points.push(pos);
      
      if (i === 0) {
        ctx.moveTo(pos.x, pos.y);
      } else {
        // Línea curva suave entre puntos
        const prev = points[i - 1];
        const cpx = (prev.x + pos.x) / 2 + (Math.random() - 0.5) * 40;
        const cpy = (prev.y + pos.y) / 2 + (Math.random() - 0.5) * 40;
        ctx.quadraticCurveTo(cpx, cpy, pos.x, pos.y);
      }
    }
    
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();

    // Marcar puntos de inicio y fin
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(points[0].x, points[0].y, 8, 0, Math.PI * 2);
    ctx.fill();
    
    if (points.length > 1) {
      ctx.fillStyle = '#27ae60';
      ctx.beginPath();
      ctx.arc(points[points.length - 1].x, points[points.length - 1].y, 8, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function updateSigil() {
    const intention = document.getElementById('intention').value.trim();
    const consonants = extractConsonants(intention);
    
    document.getElementById('originalText').textContent = intention.toUpperCase() || '-';
    document.getElementById('consonantsText').textContent = consonants || '-';
    
    drawSigil(consonants);
  }

  function downloadSigil() {
    const link = document.createElement('a');
    link.download = 'mi-sigilo.png';
    link.href = canvas.toDataURL();
    link.click();
  }

  // Dibujo inicial
  drawSigil('');
</script>
</body>
</html>
